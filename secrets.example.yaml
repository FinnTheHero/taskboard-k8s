# Copy to 01-secrets.yaml and replace placeholder values before applying.
# For production, use kubectl create secret or a secrets manager instead of committing real values.
apiVersion: v1
kind: Secret
metadata:
  name: taskboard-secrets
  namespace: production
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: your-strong-password
  POSTGRES_DB: taskboard
  DATABASE_URL: postgresql://postgres:your-strong-password@postgres:5432/taskboard
  JWT_SECRET: your-jwt-secret-min-16-chars
