apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: taskboard
data:
  NODE_ENV: "production"
  PORT: "4000"
  # Set to your public HTTPS origin when using Cloudflare Tunnel, e.g. https://taskboard.yourdomain.com
  CORS_ORIGIN: "https://taskboard.yourdomain.com"
  JWT_EXPIRES_IN: "15m"
  REFRESH_TOKEN_EXPIRES_IN: "7d"
