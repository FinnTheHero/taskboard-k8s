# Copy to 11-cloudflared-secret.yaml, paste your token, then:
#   kubectl apply -f 11-cloudflared-secret.yaml
# Do not commit 11-cloudflared-secret.yaml with a real token.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-tunnel
  namespace: taskboard
type: Opaque
stringData:
  TUNNEL_TOKEN: "replace-with-token-from-cloudflare-dashboard"
