apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskboard
  namespace: production
spec:
  rules:
    # Hostless rule: works with OrbStack ingress IP without /etc/hosts
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    # Optional: use taskboard.local when added to /etc/hosts
    - host: taskboard.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
